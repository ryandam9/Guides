name: cloudwatch-job-logs

on:
  pull_request:
    paths:
      - "scripts/cloudwatch-job-logs/**"
      - "tests/cloudwatch-job-logs/**"
      - ".github/workflows/cloudwatch-job-logs.yml"
  push:
    branches: [master]
    paths:
      - "scripts/cloudwatch-job-logs/**"
      - "tests/cloudwatch-job-logs/**"
      - ".github/workflows/cloudwatch-job-logs.yml"

jobs:
  shellcheck-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck -S warning \
            scripts/cloudwatch-job-logs/install.sh \
            scripts/cloudwatch-job-logs/refresh-xyz-cwlogs.sh \
            tests/cloudwatch-job-logs/test-refresh-xyz-cwlogs.sh

      - name: Smoke tests
        run: bash tests/cloudwatch-job-logs/test-refresh-xyz-cwlogs.sh
