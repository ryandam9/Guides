name: Link secure transfer infographic

on:
  push:
    branches:
      - agent/add-secure-file-transfer-infographic
    paths:
      - 'docs/assets/secure-file-transfer-infographic.svg'

permissions:
  contents: write

concurrency:
  group: link-secure-transfer-infographic
  cancel-in-progress: true

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add infographic to guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guide = Path('docs/secure-file-transfer-sftp-openpgp.md')
          text = guide.read_text(encoding='utf-8')
          image_block = '''## Infographic\n\n[![Secure file transfer from System A to System B using OpenPGP/GPG and SFTP over SSH](assets/secure-file-transfer-infographic.svg)](assets/secure-file-transfer-infographic.svg)\n\n> Click the infographic to view it at full size.\n\n---\n\n'''

          if 'assets/secure-file-transfer-infographic.svg' not in text:
              marker = '## 1. The setup in one picture\n'
              if marker not in text:
                  raise SystemExit(f'Insertion marker not found in {guide}')
              text = text.replace(marker, image_block + marker, 1)
              guide.write_text(text, encoding='utf-8')
          PY

          test -s docs/assets/secure-file-transfer-infographic.svg
          rm -f .github/workflows/build-secure-transfer-infographic.yml

      - name: Commit guide update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/secure-file-transfer-sftp-openpgp.md docs/assets/secure-file-transfer-infographic.svg .github/workflows/build-secure-transfer-infographic.yml
          git commit -m 'Link secure file transfer infographic'
          git push origin HEAD:${GITHUB_REF_NAME}
